<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>Opening</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/ui.css">
<style>
/* The opening screen: the kit's loading and error states (export: StateLoading, StateError). */
.ui .opening { min-height: 100vh; min-height: 100dvh; }
.ui .opening .sk-lines { display: flex; flex-direction: column; gap: 10px; }
.ui .opening .fail-ico { width: 32px; height: 32px; color: var(--miss); }
.ui .opening .fail-ico svg { width: 32px; height: 32px; }
.ui .opening #acts:empty { display: none; }
.ui .opening #acts { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.ui .opening .why-line { font-size: 13px; line-height: 18px; color: var(--text-2); }
</style>
</head>
<body class="ui m-hub">
<main class="screen opening" id="card" aria-busy="true">
  <header class="nav"><div class="nav-left"><a class="icon-btn" href="./"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Classes</a></div><div class="nav-title"></div><div class="nav-right"></div></header>
  <div class="fail-ico" id="failico" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.5"/></g></svg></div>
  <div class="stack-8">
    <h1 class="t-title" id="h">Opening</h1>
    <p class="t-callout c2" id="msg">Fetching and unlocking this material. Usually under a second.</p>
  </div>
  <div class="sk-lines" id="sk" aria-hidden="true"><span class="sk" style="width:62%"></span><span class="sk" style="width:88%"></span><span class="sk" style="width:74%"></span><span class="sk" style="width:40%"></span></div>
  <div id="acts"></div>
</main>

<script src="assets/auth.js"></script>
<script>
/* Materials ship as ciphertext. This page fetches the .enc, asks the server for the key
   (which it only gets with a valid session), decrypts in the browser, and hands the
   document over to the material itself.
   It lives at /study/ so the material's own relative asset paths resolve: the publisher
   rewrites "../../assets/" to "assets/" for exactly this reason. */
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('m') || '';
  var h = document.getElementById('h');
  var msg = document.getElementById('msg');
  var acts = document.getElementById('acts');

  /* A material that never opens is invisible to the visit diary, because sync.js arrives with
     the material. So the failure is written into the diary's queue here, and the next page that
     loads sync.js (the hub, or this one on a retry) sends it. Same switch as the review log. */
  function noteFailure(title, why) {
    try {
      if (localStorage.getItem('studyhub:hub:telemetry') === 'false') return;
      var qk = 'studyhub:hub:visitQueue', q = JSON.parse(localStorage.getItem(qk) || '[]');
      if (!Array.isArray(q) || q.length >= 300) return;
      q.push({ p: 'v' + Math.random().toString(36).slice(2, 12), k: 'error', t: Date.now(), m: id || null,
               d: { msg: 'view.html: ' + title + (why ? ' (' + String(why).slice(0, 60) + ')' : ''), file: 'view.html', line: null } });
      localStorage.setItem(qk, JSON.stringify(q));
    } catch (e) {}
  }

  function fail(title, detail, showLogin, why) {
    noteFailure(title, why);
    h.textContent = title;
    msg.className = 't-callout c2';
    msg.textContent = detail;
    document.getElementById('failico').hidden = false;
    document.getElementById('sk').hidden = true;
    document.getElementById('card').removeAttribute('aria-busy');
    acts.innerHTML = '';
    var back = document.createElement('a');
    back.className = showLogin ? 'btn btn-quiet' : 'btn btn-primary'; back.href = './'; back.textContent = 'Back to the hub';
    if (showLogin) {
      var a = document.createElement('a');
      a.className = 'btn btn-primary'; a.href = './#settings/owner'; a.textContent = 'Sign in as owner';
      acts.appendChild(a);
    }
    acts.appendChild(back);
  }

  if (!id) return fail('Nothing to open', 'No material was named in the address.');
  if (!window.StudyAuth) {
    return fail('Could not start', 'A required script did not load. Reload the page.');
  }
  if (!window.crypto || !crypto.subtle) {
    return fail('Cannot decrypt here',
      'This browser does not expose Web Crypto, which usually means the page is not on a secure connection.');
  }

  StudyAuth.catalog().then(function (items) {
    var m = null;
    for (var i = 0; i < items.length; i++) if (items[i].id === id) m = items[i];
    if (!m) return fail('Not found', 'No material with that name is available to you.');
    document.title = m.title || 'Study';
    h.textContent = m.title || 'Opening';

    return StudyAuth.openMaterial(m.path, m.id).then(function (html) {
      // Hand the whole document over. Same URL, same origin, so localStorage, the
      // service worker and StudyStore all keep working exactly as before.
      document.open();
      document.write(html);
      document.close();
    });
  }).catch(function (e) {
    var k = String(e && e.message);
    if (k === 'locked') {
      return fail('Locked', 'The owner has held this one back. It opens with the admin code.', true);
    }
    if (k === 'missing_file') {
      return fail('Not published', 'The encrypted file for this material is not on the server yet.');
    }
    if (k === 'decrypt_failed') {
      return fail('Could not decrypt',
        'The key did not fit this file. It was probably republished with a new key. Reload the hub and try again.');
    }
    return fail('Could not open it', 'Something went wrong fetching this material. Check your connection and try again.', false, k);
  });
})();
</script>
</body>
</html>
