<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plate 50 — United States Political Quiz Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC; --sheet:#FBFCFA; --ink:#17242A; --ink2:#5E6E72; --ink3:#8B9A9C;
  --land:#DCE4DB; --rule:#BAC5BD; --hair:#D4DCD3;
  --mark:#7B4B9E; --ok:#3B7A4E; --no:#B23A2E; --sp:#B87614; --hydro:#8FB0C4;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --cond:'IBM Plex Sans Condensed','Helvetica Neue',Arial,sans-serif;
  --serif:'Spectral',Georgia,serif;
}
*{box-sizing:border-box}
:root{color-scheme:light only}
html,body{margin:0;padding:0;background-color:#EEF1EC}
html{min-height:100%}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--serif);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
.wrap{max-width:1500px;margin:0 auto;padding:0 14px 80px;
  background-color:var(--paper); min-height:100vh; min-height:100dvh;
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px}
input,button,select,textarea{color-scheme:light only}
button,input,label,.tab,.rcard{touch-action:manipulation}

/* ---- sheet collar ---- */
.collar{border-bottom:1.5px solid var(--ink);background:var(--paper);
  position:sticky;top:0;z-index:40;padding:10px 0 0}
.collar-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.eyebrow{font-family:var(--cond);font-weight:600;text-transform:uppercase;
  letter-spacing:.16em;font-size:11px;color:var(--ink2)}
.title{font-family:var(--serif);font-weight:600;font-size:clamp(19px,3.4vw,27px);
  letter-spacing:-.01em;line-height:1.1;margin:0}
.title em{font-style:italic;font-weight:400;color:var(--ink2)}
.plateid{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.06em;margin-left:auto}

/* tabs */
.tabs{display:flex;gap:0;margin-top:10px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  font-size:11.5px;padding:9px 14px;border:1px solid var(--rule);border-bottom:none;
  background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap;
  margin-right:-1px;position:relative;top:1px;border-radius:2px 2px 0 0}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.5)}
.tab[aria-selected="true"]{background:var(--sheet);color:var(--ink);border-color:var(--ink);
  border-bottom:1.5px solid var(--sheet);z-index:2}
.tab:focus-visible{outline:2px solid var(--mark);outline-offset:1px}

/* ---- two column ---- */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.mapcol,.work{min-width:0}
@media(min-width:1080px){
  .stage{grid-template-columns:minmax(0,1.3fr) minmax(400px,1fr);gap:26px;align-items:start}
  .mapcol{position:sticky;top:118px}
}

/* ---- map plate ---- */
.plate{position:relative;background:var(--sheet);border:1.5px solid var(--ink);
  margin-top:14px;padding:9px}
.plate::before,.plate::after{content:'';position:absolute;width:11px;height:11px;
  border:1px solid var(--ink3);pointer-events:none}
.plate::before{top:3px;left:3px;border-right:none;border-bottom:none}
.plate::after{bottom:3px;right:3px;border-left:none;border-top:none}
.mapbox{position:relative;overflow:hidden;background:var(--sheet);
  touch-action:none;cursor:grab}
.mapbox.drag{cursor:grabbing}
@media(max-width:1079px){.collar{position:static}
  .mapcol{position:sticky;top:0;z-index:30;background:var(--paper);padding-bottom:6px}
  .mapbox{max-height:52vh}}
svg#map{display:block;width:100%;height:100%}

/* state styling */
.st path{fill:var(--land);stroke:var(--ink);stroke-width:.85;
  vector-effect:non-scaling-stroke;transition:fill .16s ease}
.st .lead{fill:none;stroke:var(--ink2);stroke-width:.7;vector-effect:non-scaling-stroke}
.st .mk{fill:#fff;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.st .mn{fill:var(--ink);font-family:var(--mono);font-weight:500;text-anchor:middle;
  dominant-baseline:central;pointer-events:none;user-select:none}
.st{cursor:pointer}
.st:hover path{fill:#CFDACE}
.st.on path{fill:#D8C6E8}
.st.on .mk{fill:var(--mark);stroke:var(--mark)}
.st.on .mn{fill:#fff}
.st.on .lead{stroke:var(--mark);stroke-width:1.4}
.st.ok path{fill:#C4DCC6} .st.ok .mk{fill:var(--ok);stroke:var(--ok)} .st.ok .mn{fill:#fff}
.st.no path{fill:#EFC9C3} .st.no .mk{fill:var(--no);stroke:var(--no)} .st.no .mn{fill:#fff}
.st.sp path{fill:#F2DFBD} .st.sp .mk{fill:var(--sp);stroke:var(--sp)} .st.sp .mn{fill:#fff}
.st.mute path{fill:#E9EDE8;stroke:var(--rule)} .st.mute .mk,.st.mute .mn,.st.mute .lead{display:none}
.st.hidenum .mk,.st.hidenum .mn,.st.hidenum .lead{display:none}
.st.solo path{fill:var(--mark)}

/* map controls */
.mapctl{position:absolute;right:7px;bottom:7px;display:flex;gap:5px;z-index:5}
.mapctl button{font-family:var(--mono);font-size:14px;width:32px;height:32px;
  background:var(--sheet);border:1px solid var(--ink);color:var(--ink);cursor:pointer;
  line-height:1;border-radius:2px;padding:0}
.mapctl button:hover{background:var(--land)}
.mapctl button:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.regionjump{display:flex;gap:4px;background:var(--sheet);border:1.5px solid var(--ink);
  border-top:none;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.regionjump::-webkit-scrollbar{display:none}
.regionjump button{flex:none}
.regionjump b{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.13em;
  font-size:9.5px;color:var(--ink3);align-self:center;padding-right:3px;flex:none}
.regionjump button{font-family:var(--cond);font-weight:600;font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;padding:4px 7px;background:rgba(251,252,250,.92);border:1px solid var(--rule);
  color:var(--ink2);cursor:pointer;border-radius:2px}
.regionjump button:hover{border-color:var(--ink);color:var(--ink)}

/* marginalia data block */
.margin{display:flex;flex-wrap:wrap;gap:0;border:1.5px solid var(--ink);border-top:none;
  background:var(--sheet)}
.cell{flex:1 1 auto;min-width:78px;padding:7px 11px;border-right:1px solid var(--rule)}
.cell:last-child{border-right:none}
.cell .k{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.13em;
  font-size:9.5px;color:var(--ink3);display:block}
.cell .v{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink);
  display:block;line-height:1.3}
.cell .v small{font-size:11px;color:var(--ink3)}

/* buttons */
.btn{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.11em;
  font-size:11.5px;padding:10px 16px;border:1.5px solid var(--ink);background:var(--ink);
  color:var(--sheet);cursor:pointer;border-radius:2px}
.btn:hover{background:#22343c}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--land)}
.btn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}

/* work area */
.work{padding-top:16px}
.sectlabel{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.14em;
  font-size:10.5px;color:var(--ink3);border-bottom:1px solid var(--rule);padding-bottom:5px;
  margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}
@media(min-width:640px) and (max-width:1079px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ans{display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--hair);padding:2px 0}
.ans .n{font-family:var(--mono);font-size:11.5px;color:var(--ink3);width:20px;
  text-align:right;flex:none;font-weight:500}
.ans input{flex:1;min-width:0;border:none;background:transparent;font-family:var(--mono);
  font-size:16px;color:var(--ink);-webkit-text-fill-color:var(--ink);
  padding:7px 2px;outline:none;border-radius:0}
.ans.ok input{-webkit-text-fill-color:var(--ok)}
.ans.no input{-webkit-text-fill-color:var(--no)}
.ans.sp input{-webkit-text-fill-color:var(--sp)}
.ans input::placeholder{color:#C3CCC4}
.ans:focus-within{border-bottom-color:var(--mark)}
.ans:focus-within .n{color:var(--mark);font-weight:600}
.ans.ok{border-bottom-color:var(--ok)} .ans.ok input{color:var(--ok)}
.ans.no{border-bottom-color:var(--no)} .ans.no input{color:var(--no);text-decoration:line-through}
.ans.sp{border-bottom-color:var(--sp)} .ans.sp input{color:var(--sp)}
.ans{scroll-margin-top:130px}
.ans .fix{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:none;max-width:46%;
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* prompt engine */
.prompt{background:var(--sheet);border:1.5px solid var(--ink);padding:20px 18px;text-align:center}
.prompt .q{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.14em;
  font-size:10.5px;color:var(--ink3)}
.prompt .big{font-family:var(--mono);font-weight:600;font-size:44px;line-height:1.1;margin:6px 0 4px}
.prompt input{width:100%;max-width:340px;scroll-margin-bottom:24px;font-family:var(--mono);font-size:19px;text-align:center;
  padding:11px 8px;border:none;border-bottom:2px solid var(--ink);background:transparent;
  color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;
  outline:none;margin-top:8px;border-radius:0}
.prompt input:disabled{-webkit-text-fill-color:var(--ink2);opacity:1}
.prompt .fb{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.05em;
  min-height:22px;margin-top:11px;text-transform:uppercase}
.fb.g{color:var(--ok)} .fb.r{color:var(--no)} .fb.a{color:var(--sp)}
.bar{height:5px;background:var(--land);border:1px solid var(--rule);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);width:0;transition:width .3s}

/* blank navigator */
.qnav{position:fixed;right:12px;bottom:calc(14px + var(--kbh,0px) + env(safe-area-inset-bottom,0px));
  z-index:60;display:flex;align-items:center;gap:5px;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:3px;padding:5px 6px;
  box-shadow:0 2px 0 rgba(23,36,42,.18)}
.qnav button{width:40px;height:40px;font-size:18px;font-family:var(--mono);background:var(--ink);
  color:var(--sheet);border:none;border-radius:2px;cursor:pointer;line-height:1;padding:0}
.qnav button:hover{background:#22343c}
.qnav button:active{transform:translateY(1px)}
.qnav span{font-family:var(--mono);font-size:11px;color:var(--ink2);min-width:46px;text-align:center}
@media(min-width:1080px){.qnav{right:20px;bottom:20px}}
.ans.sel{border-bottom-color:var(--mark)}
.ans.sel .n{color:var(--mark);font-weight:600}
.grid.live .ans.no input{text-decoration:none}

/* readiness */
.ready{background:var(--sheet);border:1.5px solid var(--ink);padding:13px 14px;margin-bottom:14px}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--cond);font-weight:600;letter-spacing:.12em;font-size:10.5px;
  padding:4px 9px;border:1px solid;text-transform:uppercase;border-radius:2px;display:inline-block}
.chip.g{color:var(--ok);border-color:var(--ok);background:#E7F0E8}
.chip.a{color:var(--sp);border-color:var(--sp);background:#F6EBD4}
.chip.r{color:var(--no);border-color:var(--no);background:#F5E2DE}
.rproj{font-family:var(--mono);font-weight:600;font-size:25px;letter-spacing:-.01em}
.rproj small{font-size:11.5px;color:var(--ink3);font-weight:400;letter-spacing:0}
.rdate{margin-left:auto;font-family:var(--cond);font-weight:600;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.rdate input{font-family:var(--mono);font-size:13px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);padding:4px 6px;border-radius:2px;color-scheme:light}
.seg{display:flex;height:9px;border:1px solid var(--ink);margin:11px 0 6px;background:var(--paper);overflow:hidden}
.seg i{display:block;height:100%}
.rleg{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.rcoach{font-size:14.5px;color:var(--ink);border-top:1px solid var(--rule);margin-top:10px;padding-top:9px;line-height:1.5}
.rweak{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:6px}
.m-hi{color:var(--ok)!important} .m-mid{color:var(--sp)!important} .m-lo{color:var(--no)!important}
.miniv{font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.06em;
  margin-top:9px;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* score */
.score{background:var(--sheet);border:1.5px solid var(--ink);padding:16px 18px;margin-bottom:16px}
.score .huge{font-family:var(--mono);font-weight:600;font-size:46px;line-height:1;letter-spacing:-.02em}
.score .huge small{font-size:19px;color:var(--ink3);font-weight:400}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-family:var(--cond);
  font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.legend i{width:11px;height:11px;border:1px solid var(--ink);display:block;border-radius:2px}
.misslist{margin-top:14px;border-top:1px solid var(--rule);padding-top:11px}
.miss{display:flex;gap:9px;align-items:baseline;font-family:var(--mono);font-size:12.5px;
  padding:4px 0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.miss b{color:var(--ink3);font-weight:500;width:22px;flex:none;text-align:right}
.miss .yours{color:var(--no);text-decoration:line-through}
.miss .real{color:var(--ok);font-weight:600}
.miss .note{color:var(--ink3);font-size:11px}

/* region cards */
.rgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.rgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.rgrid{grid-template-columns:1fr}}
@media(min-width:1400px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.rcard{text-align:left;background:var(--sheet);border:1px solid var(--rule);padding:11px 13px;
  cursor:pointer;border-radius:2px;font-family:inherit;color:inherit;display:block;width:100%}
.rcard:hover{border-color:var(--ink)}
.rcard[aria-current="true"]{border-color:var(--ink);border-left:4px solid var(--mark)}
.rcard .rn{font-family:var(--cond);font-weight:600;font-size:13.5px;letter-spacing:.03em;
  display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rcard .rc{font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:none}
.rcard .rs{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.rcard .done{color:var(--ok)}

/* playbook */
.book{max-width:760px}
.book h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:30px 0 8px;
  letter-spacing:-.01em}
.book h2:first-child{margin-top:4px}
.book h3{font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.11em;
  font-size:11.5px;color:var(--ink2);margin:20px 0 6px}
.book p{margin:0 0 12px;font-size:16px}
.book ul{margin:0 0 14px;padding-left:20px}
.book li{margin-bottom:7px}
.book .lede{font-size:17.5px;color:var(--ink2);font-style:italic;margin-bottom:18px}
.day{display:grid;grid-template-columns:60px 1fr;gap:12px;border-top:1px solid var(--rule);
  padding:11px 0}
.day .dn{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--mark);
  letter-spacing:.04em;padding-top:2px}
.day .dt{font-size:15px}
.day .dt b{font-family:var(--cond);font-weight:600;letter-spacing:.02em}
.cue{border-left:3px solid var(--rule);padding:2px 0 2px 13px;margin:0 0 14px}
.cue b{font-family:var(--cond);font-weight:600;letter-spacing:.04em;font-size:14px}
.cue span{display:block;font-size:15px;color:var(--ink2);line-height:1.5}
.src{font-family:var(--mono);font-size:11.5px;color:var(--ink3);line-height:1.7;
  border-top:1px solid var(--rule);padding-top:11px;margin-top:22px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-weight:600;
  text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--ink2);cursor:pointer}
.toggle input{accent-color:var(--mark);width:15px;height:15px;margin:0}
@media(max-width:1079px){
  .ans{scroll-margin-top:250px}
  .ans input{padding:11px 2px}
  .mapctl button{width:38px;height:38px;font-size:16px;background:rgba(251,252,250,.94)}
  html.kbd .mapbox{height:23vh;min-height:120px;max-height:190px}
  html.kbd .regionjump{display:none}
  html.kbd .mapctl{display:none}
  html.kbd .cell{padding:3px 9px}
  html.kbd .mapcol{padding-bottom:3px}
  html.kbd .prompt{padding:11px 12px}
  html.kbd .prompt .big{font-size:22px;margin:1px 0}
  html.kbd .plate{padding:5px;margin-top:6px}
  html.kbd .bar{margin-top:8px}
  html.kbd .btnrow{margin:9px 0}
  html.kbd .prompt .q{font-size:9.5px}
  html.kbd .work > p{display:none}
  html.kbd .ready{display:none}
  .prompt{scroll-margin-top:210px;scroll-margin-bottom:16px}
}
@media(max-width:560px){
  .tab{padding:8px 10px;font-size:10.5px;letter-spacing:.07em}
  .cell{min-width:64px;padding:6px 9px}
  .cell .v{font-size:13.5px}
}
#printout{display:none}
@media print{
  @page{size:letter portrait;margin:13mm}
  html,body,.wrap{background:#fff !important;background-image:none !important;
    min-height:0 !important;padding:0 !important;margin:0 !important;max-width:none !important}
  .collar,.stage,.qnav{display:none !important}
  #printout{display:block;color:#000;font-family:Georgia,'Times New Roman',serif}
  .psheet{page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  .phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:7px;font-size:12pt}
  .phead b{font-size:14pt}
  .pmeta{font-family:ui-monospace,monospace;font-size:8.5pt}
  .psvg{display:block;width:100%;height:auto;max-height:86mm;margin:0 auto}
  .pnote{font-size:9pt;margin:5px 0 6px;font-style:italic}
  .pblanks{list-style:none;margin:0;padding:0;column-count:3;column-gap:9mm}
  .pkey .pblanks{column-count:3;column-gap:8mm}
  .pkey .pblanks li{padding:2.2mm 0}
  .pblanks li{display:flex;align-items:baseline;gap:5px;
    break-inside:avoid;page-break-inside:avoid;padding:1.05mm 0}
  .pn{font-family:ui-monospace,monospace;font-size:8pt;line-height:1;width:7mm;text-align:right;flex:none}
  .pl{flex:1;border-bottom:.6pt solid #000;height:3.7mm}
  .pk{font-family:ui-monospace,monospace;font-size:9.5pt}
}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header class="collar">
  <div class="collar-top">
    <div>
      <div class="eyebrow">APUSH · Sheet exercise</div>

/* ---------- persistence (best effort) ---------- */
/* Chain: window.storage (Claude artifact sandbox) -> StudyStore (hub sync) ->
   plain localStorage in StudyStore's own key format -> in-memory. Each link degrades to
   the next, so this file keeps working opened from anywhere. */
const SYNC_NS = 'fifty-states';
if (window.StudyStore) { try{ StudyStore.init({ namespace: SYNC_NS }); }catch(e){} }
const lsKey = k => 'studyhub:' + SYNC_NS + ':' + k;

/* A sync can land while this page is open — another device's work arriving mid-session.
   Without this the in-memory record would stay stale, and the next saveFS() would write
   it straight back over what just merged in. 'change' only fires for data from elsewhere,
   never for our own writes. */
if (window.StudyStore) {
  StudyStore.on('change', c => {
    if (!c || c.ns !== SYNC_NS) return;
    try{
      mem[c.key] = c.value;
      if (c.key === 'fsrs' && c.value && c.value.states){
        FS = c.value;
        ensureFS();
        const typing = document.activeElement &&
          /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
        const tab = document.querySelector('.tab[aria-selected="true"]');
        // Only the study dashboard is safe to redraw: the other modes hold live work.
        if (!typing && tab && tab.dataset.mode === 'review') modeReview();
      }
    }catch(e){}
  });
}
const mem = {};
const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r) { const v = JSON.parse(r.value); mem[k]=v; return v; } }catch(e){}
    try{
      if (window.StudyStore){ const v = await StudyStore.get(k); if (v != null){ mem[k]=v; return v; } }
      else { const raw = localStorage.getItem(lsKey(k)); if (raw != null){ const v = JSON.parse(raw); mem[k]=v; return v; } }
    }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){}
    try{
      if (window.StudyStore) StudyStore.set(k, v);
      else localStorage.setItem(lsKey(k), JSON.stringify(v));
    }catch(e){}
  }
};

/* ---------- svg build ---------- */
const mapbox = document.getElementById('mapbox');
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.id = 'map';
svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
mapbox.appendChild(svg);

const G = {};
for (const name of NAMES){
  const d = MAP[name];
  const g = document.createElementNS(svg.namespaceURI,'g');
  g.setAttribute('class','st'); g.dataset.name = name;
  const p = document.createElementNS(svg.namespaceURI,'path');
  p.setAttribute('d', d.d); g.appendChild(p);
  let lead = null;
  const at = d.l ? d.l : d.a;
  if (d.l){
    lead = document.createElementNS(svg.namespaceURI,'polyline');
    lead.setAttribute('class','lead');
    lead.setAttribute('points', `${d.a[0]},${d.a[1]} 958,${d.l[1]} ${d.l[0]-13},${d.l[1]}`);
    g.appendChild(lead);
  }
  const c = document.createElementNS(svg.namespaceURI,'circle');
  c.setAttribute('class','mk'); c.setAttribute('cx',at[0]); c.setAttribute('cy',at[1]); c.setAttribute('r',12.5);
  const t = document.createElementNS(svg.namespaceURI,'text');
  t.setAttribute('class','mn'); t.setAttribute('x',at[0]); t.setAttribute('y',at[1]); t.setAttribute('font-size',13);
  g.appendChild(c); g.appendChild(t);
  svg.appendChild(g);
  G[name] = {g,c,t,lead,at};
}
function setNum(name,n){ G[name].t.textContent = n==null ? '' : n; }
function clearNums(){ NAMES.forEach(n=>setNum(n,null)); }
function setClass(name,cls){ G[name].g.setAttribute('class','st'+(cls?' '+cls:'')); }
function resetClasses(cls){ NAMES.forEach(n=>setClass(n,cls||'')); }

/* ---------- view ---------- */
let VB = {x:0,y:0,w:VW,h:VH}, raf=0, activeName=null;

/* the viewBox tracks the container's shape, so the map always fills the
   frame instead of letterboxing when the keyboard squashes it into a strip */
function aspect(){
  const r = mapbox.getBoundingClientRect();
  return (r.width > 0 && r.height > 0) ? r.width / r.height : VW/VH;
}
function apply(){
  svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
  let k = VB.w/VW;
  const px = (mapbox.clientWidth||900) / VB.w;
  if (px > 0) k *= Math.min(1.65, Math.max(1, 9 / (13 * k * px)));
  const near = VB.w < 470;
  for (const n of NAMES){
    const o = G[n], d = MAP[n];
    if (d.l){
      const at = near ? d.a : d.l;
      o.c.setAttribute('cx',at[0]); o.c.setAttribute('cy',at[1]);
      o.t.setAttribute('x',at[0]);  o.t.setAttribute('y',at[1]);
      if (o.lead) o.lead.style.display = near ? 'none' : '';
    }
    o.c.setAttribute('r',12.5*k); o.t.setAttribute('font-size',13*k);
  }
}
function clamp(v){
  if (!isFinite(v.w) || v.w <= 0) v.w = VW;
  const A = aspect(), maxW = Math.max(VW, VH*A);
  v.w = Math.min(maxW, Math.max(VW/14, v.w));
  v.h = v.w / A;
  v.x = v.w >= VW ? (VW - v.w)/2 : Math.min(VW - v.w, Math.max(0, v.x));
  v.y = v.h >= VH ? (VH - v.h)/2 : Math.min(VH - v.h, Math.max(0, v.y));
  return v;
}
function goTo(t, animate=true){
  clamp(t);
  if (!animate || matchMedia('(prefers-reduced-motion:reduce)').matches){ VB=t; apply(); return; }
  const s = {...VB}, t0 = performance.now(), dur = 320;
  cancelAnimationFrame(raf);
  (function step(now){
    const p = Math.min(1, Math.max(0, (now-t0)/dur)), e = 1-Math.pow(1-p,3);
    VB = {x:s.x+(t.x-s.x)*e, y:s.y+(t.y-s.y)*e, w:s.w+(t.w-s.w)*e, h:s.h+(t.h-s.h)*e};
    apply(); if (p<1) raf = requestAnimationFrame(step);
  })(t0);
}
function centerOn(cx,cy,w,animate){ const A=aspect(); goTo({x:cx-w/2, y:cy-(w/A)/2, w, h:w/A}, animate); }
/* frame a bounding box so it fits both dimensions of whatever shape the map is */
function fitBox(b, pad, minW, animate){
  const bw = b[2]-b[0], bh = b[3]-b[1];
  // breathing room scales with the state, so Rhode Island isn't swallowed by
  // the same margin that suits Texas
  if (pad==null) pad = Math.min(40, Math.max(8, 0.35*Math.max(bw,bh)));
  minW = minW || 110;
  const A = aspect();
  const w = Math.max(minW, bw + pad*2, (bh + pad*2) * A);
  centerOn((b[0]+b[2])/2, (b[1]+b[3])/2, w, animate);
}
function zoomBy(f){ centerOn(VB.x+VB.w/2, VB.y+VB.h/2, VB.w*f); }
function fit(){ activeName=null; const A=aspect(), w=Math.max(VW, VH*A);
  goTo({x:(VW-w)/2, y:(VH-w/A)/2, w, h:w/A}); }
function locate(name, minW, animate){
  if(!MAP[name]) return;
  activeName = name;
  fitBox(MAP[name].b, null, minW || 110, animate);
}
/* when the keyboard opens or closes the frame changes shape: re-frame the
   state being asked about so it never gets clipped or shrunk out of view */
let reflowT = 0;
function reflow(){
  clearTimeout(reflowT);
  reflowT = setTimeout(()=>{
    if (activeName && MAP[activeName]) locate(activeName, 110, false);
    else { clamp(VB); apply(); }
  }, 60);
}
document.getElementById('zin').onclick = ()=>zoomBy(1/1.5);
document.getElementById('zout').onclick = ()=>zoomBy(1.5);
document.getElementById('zfit').onclick = fit;

const rj = document.getElementById('rjump');
JUMPS.forEach(j=>{ const b=document.createElement('button'); b.textContent=j.n;
  b.onclick=()=>{ activeName=null; fitBox(j.b, 12, 200); }; rj.appendChild(b); });

/* pan + pinch + wheel */
const pts = new Map();
let pan=null, pinch=null, dragMoved=false;
mapbox.addEventListener('pointerdown', e=>{
  try{ mapbox.setPointerCapture(e.pointerId); }catch(_){}
  cancelAnimationFrame(raf);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pts.size===1){ pan={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y}; dragMoved=false; }
  else if (pts.size===2){
    pan=null;
    const [p1,p2]=[...pts.values()];
    activeName=null;
    pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1, vb:{...VB},
           mx:(p1.x+p2.x)/2, my:(p1.y+p2.y)/2};
    dragMoved=true;
  }
  mapbox.classList.add('drag');
});
mapbox.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r = mapbox.getBoundingClientRect();
  if (pts.size>=2 && pinch){
    const [p1,p2]=[...pts.values()];
    const d = Math.hypot(p1.x-p2.x,p1.y-p2.y)||1;
    let w = Math.max(VW/14, pinch.vb.w * pinch.d/d);
    const fx=(pinch.mx-r.left)/r.width, fy=(pinch.my-r.top)/r.height;
    const mapx=pinch.vb.x+fx*pinch.vb.w, mapy=pinch.vb.y+fy*pinch.vb.h;
    const A=aspect();
    VB={x:mapx-fx*w, y:mapy-fy*(w/A), w, h:w/A};
    clamp(VB); apply();
  } else if (pan){
    const sc=VB.w/r.width, dx=e.clientX-pan.x, dy=e.clientY-pan.y;
    if(Math.abs(dx)+Math.abs(dy)>8){ dragMoved=true; activeName=null; }
    VB.x=pan.vx-dx*sc; VB.y=pan.vy-dy*sc; clamp(VB); apply();
  }
});
function endPtr(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(pts.size===1){ const [p1]=[...pts.values()]; pan={x:p1.x,y:p1.y,vx:VB.x,vy:VB.y}; }
  if(pts.size===0){ pan=null; mapbox.classList.remove('drag'); }
}
mapbox.addEventListener('pointerup', endPtr);
mapbox.addEventListener('pointercancel', endPtr);
mapbox.addEventListener('wheel', e=>{ e.preventDefault(); cancelAnimationFrame(raf);
  zoomBy(e.deltaY>0?1.16:1/1.16); }, {passive:false});

svg.addEventListener('click', e=>{
  if (dragMoved){ dragMoved=false; return; }
  const g = e.target.closest('.st'); if(!g) return;
  onStateClick(g.dataset.name);
});
let onStateClick = ()=>{};

/* keyboard + resize awareness */
if (window.visualViewport){
  const kb=()=>{ document.documentElement.classList.toggle('kbd',
    window.innerWidth<1080 && window.visualViewport.height < window.innerHeight-150);
    document.documentElement.style.setProperty('--kbh',
      Math.max(0, window.innerHeight - window.visualViewport.height)+'px');
    reflow(); };

/* ---------- answer checking ---------- */
const norm = s => (s||'').toLowerCase().replace(/[^a-z]/g,'');
const NORMMAP = {}; NAMES.forEach(n=>NORMMAP[norm(n)]=n);
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
/* returns {v:'ok'|'sp'|'swap'|'no', other:name|null} */
function judge(input, answer){
  const a = norm(input), b = norm(answer);
  if (!a) return {v:'no', other:null};
  if (a === b) return {v:'ok', other:null};
  if (NORMMAP[a]) return {v:'swap', other:NORMMAP[a]};
  const d = lev(a,b);
  if (d <= 2 && b.length >= 5) return {v:'sp', other:null};
  if (d <= 1) return {v:'sp', other:null};
  return {v:'no', other:null};
}

/* ---------- FSRS-5 memory model ----------
   One record per state, shared by every mode. Grades are inferred from
   answers instead of asked for: exact and fast = Easy, exact = Good,
   right state wrong spelling = Hard, wrong or blank or revealed = Again.
   Same-day reviews use the FSRS-5 short-term stability formula, so the
   model stays meaningful inside a cramming week, not just across months. */
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
           0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5, FCT=19/81, TARGET=0.9, DAY=864e5;
const AGAIN=1, HARD=2, GOOD=3, EASY=4;
const retriev = (tDays,s) => s>0 ? Math.pow(1 + FCT*Math.max(tDays,0)/s, DECAY) : 0;
const clampD = d => Math.min(10, Math.max(1, d));
const D0 = g => clampD(W[4] - Math.exp(W[5]*(g-1)) + 1);

let FS = { states:{}, quizDate:null, exams:[] };
function ensureFS(){
  NAMES.forEach(n=>{ if(!FS.states[n]) FS.states[n] = {s:0,d:5,last:0,reps:0,lapses:0}; });
  if(!Array.isArray(FS.exams)) FS.exams = [];
}
function migrateLeitner(old){           // one-time upgrade from the old box deck
  const S = [0.4, 1.5, 5, 14];
  for(const n of NAMES){
    const o = old[n]; if(!o || (!o.seen && !o.b)) continue;
    FS.states[n] = { s:S[Math.min(3,o.b||0)], d:5, last:Date.now()-12*36e5,
                     reps:Math.max(o.seen||0, o.b||0, 1), lapses:0 };
  }
}
function saveFS(){ store.set('fsrs', FS); }

function rate(name, g, now){
  now = now || Date.now();
  const c = FS.states[name];
  if(!c.reps){ c.s = W[g-1]; c.d = D0(g); }
  else {
    const t = (now - c.last)/DAY;
    const r = retriev(Math.max(t, 0.0007), c.s);
    c.d = clampD(W[7]*D0(4) + (1-W[7])*(c.d - W[6]*(g-3)));
    if (t < 1){                                    // same-day: short-term memory
      c.s = c.s * Math.exp(W[17]*(g-3+W[18]));
      if (g===AGAIN) c.lapses++;
    } else if (g===AGAIN){                         // lapse
      c.lapses++;
      c.s = Math.min(c.s, W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp(W[14]*(1-r)));
    } else {                                       // successful long-term review
      const hp = g===HARD ? W[15] : 1, eb = g===EASY ? W[16] : 1;
      c.s = c.s * (Math.exp(W[8])*(11-c.d)*Math.pow(c.s,-W[9])*(Math.exp(W[10]*(1-r))-1)*hp*eb + 1);
    }
  }
  c.s = Math.max(0.01, Math.min(365, c.s));
  c.reps++; c.last = now;
}
const gradeFromJudge = (v, secs) =>
  v==='ok' ? (secs!=null && secs<4 ? EASY : GOOD) : v==='sp' ? HARD : AGAIN;

/* the projection horizon: the quiz itself, or tomorrow until a date is set */
function horizon(){
  if (FS.quizDate){
    const t = new Date(FS.quizDate+'T08:00').getTime();
    // on quiz day itself, project to at least an hour out so the number means something
    return Math.max(t, Date.now() + 36e5);
  }
  return Date.now() + DAY;
}
function rAtQuiz(n){
  const c = FS.states[n];
  return c.reps ? retriev((horizon()-c.last)/DAY, c.s) : null;
}
function studyStats(){
  const solid=[], risk=[], weak=[], untested=[];
  let proj=0, minR=1;
  for(const n of NAMES){
    const r = rAtQuiz(n);
    if (r===null){ untested.push(n); continue; }
    proj += r; if (r<minR) minR=r;
    (r>=0.9 ? solid : r>=0.7 ? risk : weak).push(n);
  }
  weak.sort((x,y)=>rAtQuiz(x)-rAtQuiz(y));
  const below = NAMES.filter(n=>{const r=rAtQuiz(n); return r!==null && r<TARGET;});
  const best48 = FS.exams.filter(e=>Date.now()-e.ts < 2*DAY)
                         .reduce((m,e)=>Math.max(m,e.exact), -1);
  return {solid, risk, weak, untested, below, proj, minR, best48};
}
function verdictOf(st){
  if (!st.untested.length && st.proj>=47.5 && st.minR>=0.75 && st.best48>=48)
    return {label:'Ready', cls:'g'};
  if (st.untested.length<=3 && st.proj>=44)
    return {label:'Close', cls:'a'};
  return {label:'Not yet', cls:'r'};
}
function coachLine(st, v){
  if (v.cls==='g') return 'Ready. One clean sheet the morning of the quiz, nothing new the night before.';
  if (!FS.quizDate) return 'Set your quiz date above. Until then the projection targets tomorrow morning.';
  if (st.untested.length) return st.untested.length+' states have never been tested. They are served next below, or clear them in bulk with a Region drill.';
  if (st.best48 < 48) return 'The record looks good but readiness needs proof in the real format: take a full Exam sheet. The bar is 48 or better inside two days of the quiz.';
  if (st.proj < 47.5) return 'Projected '+Math.round(st.proj)+'/50. Keep clearing the states below target; every correct answer pushes retention past quiz day.';
  return 'Shore up the weakest states listed below, then take another full sheet.';
}
function daysToQuiz(){                      // whole calendar days, not elapsed hours
  if (!FS.quizDate) return null;
  const q = new Date(FS.quizDate+'T00:00');
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((q - t)/DAY);
}

document.getElementById('plateid').textContent =

    `<div class="cell"><span class="k">${c[0]}</span><span class="v">${c[1]}</span></div>`).join('');
}
const pad = n => String(n).padStart(2,'0');
const mmss = ms => pad(Math.floor(ms/60000)) + ':' + pad(Math.floor(ms/1000)%60);
let clockT=0, clockStart=0;
function startClock(fn){ stopClock(); clockStart=Date.now(); clockT=setInterval(fn,1000); fn(); }
function stopClock(){ if(clockT) clearInterval(clockT); clockT=0; }
const elapsed = ()=> Date.now()-clockStart;
const short = s => s.length>13 ? s.split(' ').map(w=>w[0]).join('') : s;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let follow = window.innerWidth < 1080;

/* ---------- blank-to-blank navigator ----------
   Moves through answer grids with on-screen arrows. If the keyboard is open
   (a grid input has focus) it moves focus so typing continues; if it is
   closed it only moves the highlight, so browsing never pops the keyboard. */
let navCtx = null, navIdx = 0;
const qnav = document.getElementById('qnav');
function setNav(ctx){
  navCtx = ctx; navIdx = 0;
  qnav.classList.toggle('hide', !ctx);
  if (ctx) navSync(0);
}
function navSync(i){
  navIdx = i;
  const n = navCtx ? navCtx.inputs().length : 0;
  if (n) document.getElementById('navPos').textContent = (i+1)+' / '+n;
}
function markSel(inp){
  work.querySelectorAll('.ans.sel').forEach(r=>r.classList.remove('sel'));
  const row = inp && inp.closest('.ans');
  if (row) row.classList.add('sel');
  return row;
}
function navStep(d){
  if (!navCtx) return;
  const ins = navCtx.inputs(); if (!ins.length) return;
  const focused = ins.includes(document.activeElement);
  let i = focused ? +document.activeElement.dataset.i : navIdx;
  commitLive(ins[i]);
  i = Math.max(0, Math.min(ins.length-1, i+d));
  navSync(i);
  const inp = ins[i], row = markSel(inp);
  navCtx.hi(i);
  if (focused) inp.focus();
  trackVisible(row);
}
qnav.querySelectorAll('button').forEach(b=>{
  b.addEventListener('pointerdown', e=>e.preventDefault());   // keep keyboard state as-is
  b.addEventListener('mousedown', e=>e.preventDefault());
});
document.getElementById('navPrev').addEventListener('click', ()=>navStep(-1));
document.getElementById('navNext').addEventListener('click', ()=>navStep(1));
work.addEventListener('keydown', e=>{
  if ((e.key==='ArrowDown'||e.key==='ArrowUp') && navCtx && navCtx.inputs().includes(e.target)){
    e.preventDefault(); navStep(e.key==='ArrowDown'?1:-1);
  }
});

/* instant check: with the toggle on, each committed exam answer is judged on
   the spot, colored on the sheet and the map, and rated once into the record */
function commitLive(inp){
  if (!inp || !exam || exam.graded || !examAuto) return;
  const grid = document.getElementById('grid');
  if (!grid || !grid.contains(inp)) return;
  const i = +inp.dataset.i, name = exam.order[i], row = inp.closest('.ans');
  row.classList.remove('ok','no','sp');
  const v = inp.value.trim();
  if (!v){ setClass(name, name===exam.order[navIdx]?'on':''); return; }
  const r = judge(v, name);
  const cls = r.v==='ok' ? 'ok' : r.v==='sp' ? 'sp' : 'no';
  row.classList.add(cls); setClass(name, cls);
  if (!exam.rated.has(name)){
    exam.rated.add(name);
    rate(name, gradeFromJudge(r.v==='swap'?'no':r.v)); saveFS();
  }
}

/* scroll a field into the strip between the pinned map and the keyboard */
function keepVisible(el){
  if(!el) return;
  requestAnimationFrame(()=>{
    const r = el.getBoundingClientRect();
    if(!r.height) return;
    const vv = window.visualViewport;
    const floor = (vv ? vv.height : window.innerHeight) - 10;
    const col = document.getElementById('mapcol');
    const ceil = (window.innerWidth < 1080 && col ? col.getBoundingClientRect().bottom : 0) + 10;
    let d = 0;
    if (r.bottom > floor) d = r.bottom - floor;
    else if (r.top < ceil) d = r.top - ceil;
    if (Math.abs(d) > 4) window.scrollBy({top:d, behavior:'smooth'});
  });
}
let visTarget = null;
function trackVisible(el){ visTarget = el; keepVisible(el); }
if (window.visualViewport)
  window.visualViewport.addEventListener('resize', ()=>setTimeout(()=>keepVisible(visTarget),60));

/* ---------- MODE: exam sheet ---------- */
let exam = null, examAuto = false;
function modeExam(){
  fit(); resetClasses(); clearNums();
  exam = { order: shuffle(NAMES), graded:false, started:false, rated:new Set() };
  exam.order.forEach((n,i)=>setNum(n,i+1));
  onStateClick = name => { const i = exam.order.indexOf(name);
    const el = work.querySelector(`input[data-i="${i}"]`); if(el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); } };

  work.innerHTML = `
    <div class="sectlabel">Answer sheet<span style="display:flex;gap:14px;flex-wrap:wrap">
      <span class="toggle"><input type="checkbox" id="fol" ${follow?'checked':''}><label for="fol">Follow focus</label></span>
      <span class="toggle"><input type="checkbox" id="adv" ${examAuto?'checked':''}><label for="adv">Instant check</label></span></span></div>
    <p style="margin:0 0 14px;color:var(--ink2);font-size:15px">Every state carries a number. Write each name in the matching blank; no word bank, spelling counts. Tap a map number to jump to its blank, or use the corner arrows to move between blanks without opening the keyboard. Instant check marks each answer as you commit it and jumps ahead when you are exactly right; leave it off for an honest cold run.</p>
    <div id="out"></div>
    <div class="btnrow">
      <button class="btn" id="grade">Grade sheet</button>
      <button class="btn ghost" id="new">New sheet</button>
      <button class="btn ghost" id="printsheet">Print blank</button>
    </div>
    <div class="grid" id="grid"></div>`;

  const grid = document.getElementById('grid');
  grid.innerHTML = exam.order.map((n,i)=>
    `<label class="ans" data-i="${i}"><span class="n">${i+1}</span><input data-i="${i}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" aria-label="State ${i+1}" placeholder="state"></label>`).join('');

  const paintFromRows = except => grid.querySelectorAll('.ans').forEach(row=>{
    const nm = exam.order[+row.dataset.i];
    if (nm===except) return;
    setClass(nm, ['ok','sp','no'].find(c=>row.classList.contains(c)) || '');
  });
  const hi = i => {
    const name = exam.order[i];
    if(!exam.graded){
      if (examAuto){ paintFromRows(name); setClass(name,'on'); }
      else { resetClasses(); setClass(name,'on'); }
    }
    if(follow) locate(name);
  };
  setNav({ inputs: ()=>[...grid.querySelectorAll('input')], hi });
  grid.addEventListener('focusin', e=>{ if(e.target.tagName!=='INPUT') return;
    const i = +e.target.dataset.i;
    navSync(i); markSel(e.target); hi(i);
    trackVisible(e.target.closest('.ans'));
  });
  grid.addEventListener('focusout', e=>{ if(e.target.tagName==='INPUT') commitLive(e.target); });
  document.getElementById('adv').parentElement.parentElement.addEventListener('change',()=>{
    grid.classList.toggle('live', examAuto); });
  grid.addEventListener('input', e=>{ if(exam.graded) return;
    if(!exam.started){ exam.started=true; startClock(updExamMargin); }
    updExamMargin();
    if(examAuto && e.target.tagName==='INPUT'){
      const i=+e.target.dataset.i;
      if(norm(e.target.value)===norm(exam.order[i])){
        if (i < exam.order.length-1) navStep(1);
        else { commitLive(e.target); e.target.blur(); }
      }
    }
  });
  grid.classList.toggle('live', examAuto);
  grid.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return; e.preventDefault();
    commitLive(e.target);
    const i=+e.target.dataset.i, nx=grid.querySelector(`input[data-i="${i+1}"]`);
    if(nx) navStep(1); else document.getElementById('grade').click();
  });
  document.getElementById('fol').onchange = e => { follow = e.target.checked; };
  document.getElementById('adv').onchange = e => { examAuto = e.target.checked; };
  document.getElementById('grade').onclick = gradeExam;
  document.getElementById('new').onclick = modeExam;
  document.getElementById('printsheet').onclick = printSheet;
  stopClock(); clockStart = Date.now(); updExamMargin();
}
function filled(){ return [...work.querySelectorAll('#grid input')].filter(i=>i.value.trim()).length; }
function updExamMargin(){
  if(!exam) return;
  setMargin([['Sheet','50 states'],['Filled',`${filled()}<small> / 50</small>`],
             ['Elapsed', exam.started ? mmss(elapsed()) : '00:00'],['Mode','Exam']]);
}
function gradeExam(){
  stopClock(); const took = exam.started ? elapsed() : 0; exam.graded = true;
  const inputs = [...work.querySelectorAll('#grid input')];
  let ok=0, sp=0, misses=[];
  resetClasses();
  const now = Date.now();
  inputs.forEach(inp=>{
    const i=+inp.dataset.i, name=exam.order[i], row=inp.closest('.ans');
    const r = judge(inp.value, name);
    if(!exam.rated.has(name)) rate(name, gradeFromJudge(r.v==='swap'?'no':r.v), now);
    row.classList.remove('ok','no','sp');
    const old = row.querySelector('.fix'); if(old) old.remove();
    if(r.v==='ok'){ ok++; row.classList.add('ok'); setClass(name,'ok'); }
    else if(r.v==='sp'){ sp++; row.classList.add('sp'); setClass(name,'sp');
      row.insertAdjacentHTML('beforeend',`<span class="fix">${name}</span>`);
      misses.push({i,name,yours:inp.value.trim(),note:'spelling'}); }
    else { row.classList.add('no'); setClass(name,'no');
      row.insertAdjacentHTML('beforeend',`<span class="fix">${name}</span>`);
      misses.push({i,name,yours:inp.value.trim(),note:r.other?('that is '+r.other):(inp.value.trim()?'':'blank')}); }
  });
  const score = ok + sp;
  FS.exams.push({ts:now, exact:ok}); if(FS.exams.length>20) FS.exams=FS.exams.slice(-20);
  saveFS();
  const st = studyStats(), v = verdictOf(st);
  setMargin([['Correct',`${ok}<small> / 50</small>`],['Spelling',String(sp)],
             ['Projected',`${Math.round(st.proj)}<small> / 50</small>`],['Verdict',v.label]]);
  document.getElementById('out').innerHTML = `
    <div class="score">
      <div class="huge">${ok}<small> / 50 exact</small></div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:4px">
        ${sp} right state, wrong spelling · ${50-score} missed · ${mmss(took)}</div>
      <div class="miniv"><span class="chip ${v.cls}">${v.label}</span>&nbsp; projected ${Math.round(st.proj)} / 50 on quiz day · every answer logged to your study record</div>
      <div class="legend">
        <span><i style="background:#C4DCC6"></i>Exact</span>
        <span><i style="background:#F2DFBD"></i>Spelling</span>
        <span><i style="background:#EFC9C3"></i>Missed</span></div>
      ${misses.length?`<div class="misslist">${misses.sort((a,b)=>a.i-b.i).map(m=>
        `<div class="miss"><b>${m.i+1}</b><span class="yours">${m.yours||'—'}</span>
         <span class="real">${m.name}</span><span class="note">${m.note}</span></div>`).join('')}</div>`
      :`<div class="misslist" style="font-family:var(--mono);font-size:13px;color:var(--ok)">Clean sheet. Do it again tomorrow, not again right now.</div>`}
    </div>
    ${misses.length?`<div class="btnrow"><button class="btn" id="drill">Drill these ${misses.length}</button></div>`:''}`;
  const dr = document.getElementById('drill');
  if(dr) dr.onclick = ()=>{ selectTab('review'); modeReview(misses.map(m=>m.name)); };
  document.getElementById('out').scrollIntoView({block:'center',behavior:'smooth'});
}

/* ---------- MODE: region drill ---------- */
let region = null;
function modeRegion(){
  fit(); resetClasses('mute'); clearNums();
  setNav(null);
  onStateClick = ()=>{};
  setMargin([['Mode','Region drill'],['Chunk','—'],['Correct','—'],['Progress','—']]);
  const done = mem.regionsDone || [];
  work.innerHTML = `
    <div class="sectlabel">Pick a chunk</div>
    <p style="margin:0 0 14px;color:var(--ink2);font-size:15px">Fifty at once is too many to hold. Learn one block of five to eight, then a second, then mix them. The last card interleaves everything, which is where the real gain is.</p>
    <div class="rgrid" id="rg"></div>`;
  const rg = document.getElementById('rg');
  REGIONS.forEach(r=>{
    const rs = r.states.map(rAtQuiz);
    const seen = rs.filter(x=>x!==null);
    const pct = seen.length===rs.length ? Math.round(100*seen.reduce((s,x)=>s+x,0)/rs.length) : null;
    const cls = pct===null?'':pct>=90?'m-hi':pct>=70?'m-mid':'m-lo';
    const tag = pct===null ? (seen.length? seen.length+'/'+rs.length+' tested' : 'untested') : pct+'%';
    const b=document.createElement('button'); b.className='rcard';
    b.innerHTML=`<span class="rn">${r.name}<span class="rc ${cls}">${tag}</span></span><span class="rs">${r.cue}</span>`;
    b.dataset.rid=r.id; b.onclick=()=>runRegion(r); rg.appendChild(b);
  });
  const b=document.createElement('button'); b.className='rcard';
  b.innerHTML=`<span class="rn">Interleaved — 12 from anywhere<span class="rc">12</span></span><span class="rs">Random states pulled from the whole map. Harder than any single chunk, and the closest thing to the real test. Use it once two or three chunks feel solid.</span>`;
  b.onclick=()=>runRegion({id:'mix',name:'Interleaved',states:shuffle(NAMES).slice(0,12),cue:'No regional grouping to lean on. This is the one that predicts your score.'});
  rg.appendChild(b);
}
function runRegion(r){
  region = {r, order: shuffle(r.states)};
  resetClasses('mute'); clearNums();
  region.order.forEach((n,i)=>{ setNum(n,i+1); setClass(n,''); });
  const bs = r.states.map(n=>MAP[n].b);
  activeName = null;
  fitBox([Math.min(...bs.map(b=>b[0])), Math.min(...bs.map(b=>b[1])),
          Math.max(...bs.map(b=>b[2])), Math.max(...bs.map(b=>b[3]))], 26, 260);
  onStateClick = name => { const i=region.order.indexOf(name);
    const el=work.querySelector(`input[data-i="${i}"]`); if(el) el.focus(); };
  setMargin([['Mode','Region drill'],['Chunk',short(r.name)],['Correct',`0<small> / ${r.states.length}</small>`],['Progress','0%']]);
  work.innerHTML = `
    <div class="sectlabel">${r.name}<span style="font-family:var(--mono);text-transform:none;letter-spacing:0">${r.states.length} states</span></div>
    <div class="cue"><span>${r.cue}</span></div>
    <div id="rres"></div>
    <div class="btnrow"><button class="btn" id="rgrade">Check chunk</button>
      <button class="btn ghost" id="rback">Back to chunks</button></div>
    <div class="grid" id="rgrid"></div>`;
  const g=document.getElementById('rgrid');
  g.innerHTML = region.order.map((n,i)=>
    `<label class="ans" data-i="${i}"><span class="n">${i+1}</span><input data-i="${i}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" aria-label="State ${i+1}" placeholder="state"></label>`).join('');
  const rhi = i => { const n=region.order[i];
    region.order.forEach(x=>setClass(x,'')); setClass(n,'on');
    if(follow) locate(n); };
  setNav({ inputs: ()=>[...g.querySelectorAll('input')], hi: rhi });
  g.addEventListener('focusin',e=>{ if(e.target.tagName!=='INPUT')return;
    const i=+e.target.dataset.i;
    navSync(i); markSel(e.target); rhi(i);
    trackVisible(e.target.closest('.ans')); });
  g.addEventListener('keydown',e=>{ if(e.key!=='Enter')return; e.preventDefault();
    const nx=g.querySelector(`input[data-i="${+e.target.dataset.i+1}"]`);
    if(nx) navStep(1); else document.getElementById('rgrade').click(); });
  document.getElementById('rback').onclick = modeRegion;
  document.getElementById('rgrade').onclick = ()=>{
    let ok=0; const miss=[]; const now=Date.now();
    [...g.querySelectorAll('input')].forEach(inp=>{
      const i=+inp.dataset.i, n=region.order[i], row=inp.closest('.ans');
      const res=judge(inp.value,n); row.classList.remove('ok','no','sp');
      rate(n, gradeFromJudge(res.v==='swap'?'no':res.v), now);
      const o=row.querySelector('.fix'); if(o)o.remove();
      if(res.v==='ok'){ok++;row.classList.add('ok');setClass(n,'ok');}
      else{ row.classList.add(res.v==='sp'?'sp':'no'); setClass(n,res.v==='sp'?'sp':'no');
        row.insertAdjacentHTML('beforeend',`<span class="fix">${n}</span>`); miss.push(n); }
    });
    const pct=Math.round(ok/region.order.length*100);
    setMargin([['Mode','Region drill'],['Chunk',short(r.name)],
      ['Correct',`${ok}<small> / ${region.order.length}</small>`],['Progress',pct+'%']]);
    saveFS();
    if(ok===region.order.length && r.id!=='mix'){
      const d=mem.regionsDone||[]; if(!d.includes(r.id)) d.push(r.id);
      mem.regionsDone=d; store.set('regionsDone',d);
    }
    document.getElementById('rres').innerHTML = `<div class="score">
      <div class="huge">${ok}<small> / ${region.order.length}</small></div>
      <div style="font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:4px">
        ${ok===region.order.length?'Chunk clear. Move to the next one, then come back tomorrow.':'Still open: '+miss.join(', ')}</div></div>`;
    document.getElementById('rres').scrollIntoView({block:'center',behavior:'smooth'});
  };
}

/* ---------- MODE: study (FSRS queue + readiness) ---------- */
let rev = null;
function modeReview(seed){ modeStudy(seed); }
function modeStudy(seed){
  fit(); onStateClick = ()=>{}; setNav(null);
  rev = { cur:null, last:null, lock:false, cnt:0, shownAt:0,
          relearn:(seed||[]).map((n,i)=>({n, due:i})),
          seen:{}, right:0, asked:0 };
  work.innerHTML = `
    <div class="sectlabel">Study${seed&&seed.length?` — your ${seed.length} misses first`:''}</div>
    <div class="ready" id="dash"></div>
    <div class="prompt">
      <div class="q" id="revq">Name the highlighted state</div>
      <div class="big" id="revnum">—</div>
      <input id="revin" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" aria-label="State name" placeholder="just start typing">
      <div class="fb" id="revfb"></div>
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="revskip">Show answer</button>
      <button class="btn ghost" id="revreset">Reset record</button>
    </div>
    <p style="margin:0 0 14px;color:var(--ink2);font-size:15px">One shared memory record sits under every mode: exam sheets, region drills and speed runs all feed it. This queue serves whatever is not projected to survive until quiz day, scheduled by FSRS. A correct spelling submits itself; grades are read from your answers and speed, never asked for.</p>`;
  const rin = document.getElementById('revin');
  rin.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); answerRev(e.target.value); }});
  rin.addEventListener('input',e=>{
    if(rev.cur && norm(e.target.value)===norm(rev.cur)) answerRev(e.target.value); });
  rin.addEventListener('focus',()=>trackVisible(work.querySelector('.prompt')));
  document.getElementById('revskip').onclick = revealRev;
  document.getElementById('revreset').onclick = ()=>{
    if(!confirm('Wipe the whole study record? This clears every state\'s memory data and exam history.')) return;
    FS = {states:{}, quizDate:FS.quizDate, exams:[]}; ensureFS(); saveFS(); modeStudy();
  };
  renderDash();
  nextRev();
}
function renderDash(){
  const el = document.getElementById('dash'); if(!el) return;
  const st = studyStats(), v = verdictOf(st), N = NAMES.length;
  const segs = [[st.solid.length,'#C4DCC6'],[st.risk.length,'#F2DFBD'],
                [st.weak.length,'#EFC9C3'],[st.untested.length,'#E9EDE8']];
  const dq = daysToQuiz();
  el.innerHTML = `
    <div class="rhead">
      <span class="chip ${v.cls}">${v.label}</span>
      <span class="rproj">${st.untested.length===N?'—':Math.round(st.proj)}<small> / 50 projected${dq==null?'':dq<0?' · quiz passed':dq===0?' · quiz today':dq===1?' · quiz tomorrow':' · quiz in '+dq+'d'}</small></span>
      <label class="rdate">Quiz <input type="date" id="qd" value="${FS.quizDate||''}"></label>
    </div>
    <div class="seg">${segs.map(s=>`<i style="width:${s[0]/N*100}%;background:${s[1]}"></i>`).join('')}</div>
    <div class="rleg">${st.solid.length} solid · ${st.risk.length} at risk · ${st.weak.length} weak · ${st.untested.length} untested</div>
    <div class="rcoach">${coachLine(st,v)}</div>
    ${st.weak.length?`<div class="rweak">Weakest: ${st.weak.slice(0,8).join(', ')}</div>`:''}`;
  const qd = document.getElementById('qd');
  qd.onchange = ()=>{ FS.quizDate = qd.value || null; saveFS(); renderDash(); updStudyMargin(); };
  updStudyMargin();
}
function updStudyMargin(){
  const st = studyStats(), dq = daysToQuiz();
  setMargin([['Projected', st.untested.length===NAMES.length?'—':`${Math.round(st.proj)}<small> / 50</small>`],
             ['Below target', String(st.below.length + st.untested.length)],
             ['Session', `${rev?rev.right:0}<small> / ${rev?rev.asked:0}</small>`],
             ['Quiz', dq==null?'set date':dq<0?'passed':dq===0?'today':dq===1?'tomorrow':'in '+dq+'d']]);
}
function pickRev(){
  rev.cnt++;
  const take = n => { rev.seen[n] = rev.cnt; return n; };
  const ready = rev.relearn.filter(x=>x.due<=rev.cnt && x.n!==rev.last);
  if (ready.length || (rev.relearn.length && rev.relearn.every(x=>x.n===rev.last))){
    const x = ready[0] || rev.relearn[0];
    rev.relearn = rev.relearn.filter(y=>y!==x);
    return take(x.n);
  }
  const unseen = REGIONS.flatMap(r=>r.states).filter(n=>!FS.states[n].reps);
  // a state answered correctly rests for at least 8 cards before it can return;
  // failed states come back sooner through the relearn queue above
  const below = NAMES.filter(n=>{const r=rAtQuiz(n);
      return r!==null && r<TARGET && n!==rev.last && rev.cnt-(rev.seen[n]??-99) > 8;})
    .sort((x,y)=>rAtQuiz(x)-rAtQuiz(y));
  if (unseen.length && (!below.length || rev.cnt%3===0)) return take(unseen[0]);
  if (below.length) return take(below[Math.floor(Math.random()*Math.min(3,below.length))]);
  if (unseen.length) return take(unseen[0]);
  return null;
}
function nextRev(){
  const fbEl = document.getElementById('revfb'); if(!fbEl) return;
  fbEl.textContent=''; fbEl.className='fb';
  const inp = document.getElementById('revin'); inp.value=''; rev.lock=false;
  renderDash();
  const n = pickRev();
  if (!n){
    rev.cur = null; resetClasses('hidenum'); fit();
    const pending = NAMES.filter(x=>{const r=rAtQuiz(x); return r!==null && r<TARGET;}).length;
    document.getElementById('revnum').textContent='✓';
    if (pending){
      document.getElementById('revq').textContent='Session swept';
      fbEl.className='fb a';
      fbEl.textContent=pending+' states still under target. Spacing beats repetition: come back in a few hours, or take an exam sheet now';
    } else {
      document.getElementById('revq').textContent='Queue clear';
      fbEl.className='fb g';
      fbEl.textContent='Everything is projected above 90% on quiz day';
    }
    inp.disabled = true; inp.placeholder='';
    return;
  }
  rev.cur = n; rev.shownAt = Date.now();
  document.getElementById('revq').textContent='Name the highlighted state';
  resetClasses('mute'); setClass(n,'solo hidenum'); clearNums();
  locate(n, 130);
  document.getElementById('revnum').textContent = '?';
  inp.disabled = false;
  inp.focus(); trackVisible(work.querySelector('.prompt'));
}
function answerRev(val){
  if(rev.lock || !rev.cur || !val.trim()) return;
  const fb = document.getElementById('revfb'); if(!fb) return;
  rev.lock = true;
  const n = rev.cur, r = judge(val, n);
  const secs = (Date.now()-rev.shownAt)/1000;
  const g = gradeFromJudge(r.v==='swap'?'no':r.v, secs);
  rate(n, g); saveFS();
  rev.asked++;
  if (r.v==='ok'){ rev.right++; fb.className='fb g'; fb.textContent = g===EASY?'Correct, fast':'Correct'; }
  else if (r.v==='sp'){ fb.className='fb a'; fb.textContent='Right state, spelled '+n; }
  else {
    fb.className='fb r';
    fb.textContent = r.other ? r.other+' is elsewhere. This is '+n : 'This is '+n;
    rev.relearn.push({n, due:rev.cnt+3});
  }
  rev.last = n;
  setTimeout(nextRev, r.v==='ok' ? 550 : 1500);
}
function revealRev(){
  if(rev.lock || !rev.cur) return;
  rev.lock = true; rev.asked++;
  const fb=document.getElementById('revfb'); fb.className='fb a'; fb.textContent=rev.cur;
  rate(rev.cur, AGAIN); saveFS();
  rev.relearn.push({n:rev.cur, due:rev.cnt+3});
  rev.last = rev.cur;
  setTimeout(nextRev, 1400);
}

/* ---------- MODE: speed run ---------- */
let sp = null;
function modeSpeed(){
  fit(); onStateClick=()=>{}; clearNums(); resetClasses('mute'); setNav(null);
  sp = {order:shuffle(NAMES), i:0, right:0, miss:[], t0:0, running:false, lock:false};
  work.innerHTML = `
    <div class="sectlabel">Speed run</div>
    <div class="prompt">
      <div class="q" id="spq">Ready</div>
      <div class="big" id="spbig">50</div>
      <input id="spin" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" aria-label="State name" placeholder="waiting to start">
      <div class="fb" id="spfb"></div>
      <div class="bar"><i id="spbar"></i></div>
    </div>
    <div class="btnrow"><button class="btn" id="spstart">Start the clock</button>
      <button class="btn ghost" id="spreset">Restart</button></div>
    <p style="margin:0 0 14px;color:var(--ink2);font-size:15px">All fifty, one at a time, against the clock. Spell a state correctly and it advances on its own. Press Enter only to commit an answer you are unsure of. Fluency under time pressure is what separates a 44 from a 50.</p>
    <div id="spout"></div>`;
  setMargin([['Mode','Speed run'],['State','—'],['Correct','0<small> / 50</small>'],['Time','00:00']]);
  const inp=document.getElementById('spin');
  inp.addEventListener('keydown',e=>{ if(e.key!=='Enter')return; e.preventDefault();
    if(!sp.running){ startSpeed(); return; } speedAnswer(e.target.value); });
  inp.addEventListener('input',e=>{                       // exact match submits itself
    if(sp.running && sp.i<50 && norm(e.target.value)===norm(sp.order[sp.i])) speedAnswer(e.target.value); });
  inp.addEventListener('focus',()=>trackVisible(work.querySelector('.prompt')));
  work.querySelector('.prompt').addEventListener('click',()=>{ if(!inp.disabled) inp.focus(); });
  document.getElementById('spstart').onclick = ()=>{ if(!sp.running) startSpeed(); };
  document.getElementById('spreset').onclick = modeSpeed;
  inp.focus();
}
function startSpeed(){
  sp.running=true; sp.t0=Date.now(); clockStart=sp.t0;
  const sb=document.getElementById('spstart'); if(sb) sb.classList.add('hide');
  startClock(()=>setMargin([['Mode','Speed run'],['State',`${sp.i+1}<small> / 50</small>`],
    ['Correct',`${sp.right}<small> / 50</small>`],['Time',mmss(elapsed())]]));
  document.getElementById('spin').placeholder='just start typing';
  showSpeed();
}
function showSpeed(){
  if(!sp.running || sp.i>=50 || !document.getElementById('spq')) return;
  sp.shownAt = Date.now();
  const n = sp.order[sp.i];
  resetClasses('mute'); setClass(n,'solo hidenum'); locate(n,130);
  document.getElementById('spq').textContent = `State ${sp.i+1} of 50`;
  document.getElementById('spbig').textContent = '?';
  document.getElementById('spbar').style.width = (sp.i/50*100)+'%';
  const inp=document.getElementById('spin'); inp.value=''; sp.lock=false;
  inp.focus(); trackVisible(work.querySelector('.prompt'));
}
function speedAnswer(v){
  if(sp.lock || !sp.running || sp.i>=50) return;
  const fb=document.getElementById('spfb'); if(!fb) return;
  sp.lock = true;
  const n=sp.order[sp.i], r=judge(v,n);
  rate(n, gradeFromJudge(r.v==='swap'?'no':r.v, (Date.now()-(sp.shownAt||Date.now()))/1000)); saveFS();
  if(r.v==='ok'){ sp.right++; fb.className='fb g'; fb.textContent=n; }
  else if(r.v==='sp'){ sp.right++; fb.className='fb a'; fb.textContent='Spelling: '+n; sp.miss.push({n,y:v.trim(),note:'spelling'}); }
  else { fb.className='fb r'; fb.textContent=n; sp.miss.push({n,y:v.trim()||'—',note:r.other?('you said '+r.other):''}); }
  sp.i++;
  if(sp.i>=50) return endSpeed();
  setTimeout(showSpeed, r.v==='ok'?180:800);
}
function endSpeed(){
  stopClock(); const t=elapsed(); sp.running=false;
  if(!document.getElementById('spq')) return;
  resetClasses(); clearNums();
  document.getElementById('spbar').style.width='100%';
  document.getElementById('spq').textContent='Finished';
  document.getElementById('spbig').textContent=mmss(t);
  const inp=document.getElementById('spin'); inp.disabled=true; inp.placeholder='';
  setMargin([['Mode','Speed run'],['State','50<small> / 50</small>'],
    ['Correct',`${sp.right}<small> / 50</small>`],['Time',mmss(t)]]);
  document.getElementById('spout').innerHTML = `<div class="score" style="margin-top:16px">
    <div class="huge">${sp.right}<small> / 50 in ${mmss(t)}</small></div>
    <div style="font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:4px">
      ${(t/50/1000).toFixed(1)}s per state</div>
    ${sp.miss.length?`<div class="misslist">${sp.miss.map(m=>
      `<div class="miss"><b>·</b><span class="yours">${m.y}</span><span class="real">${m.n}</span><span class="note">${m.note}</span></div>`).join('')}</div>`
    :`<div class="misslist" style="font-family:var(--mono);font-size:13px;color:var(--ok)">Fifty for fifty.</div>`}</div>
    <div class="btnrow">${sp.miss.length?`<button class="btn" id="spdrill">Drill these ${sp.miss.length}</button>`:''}
    <button class="btn ghost" id="spagain">Run again</button></div>`;
  document.getElementById('spagain').onclick = modeSpeed;
  const d=document.getElementById('spdrill');
  if(d) d.onclick = ()=>{ selectTab('review'); modeReview(sp.miss.map(m=>m.n)); };
}

/* ---------- MODE: playbook ---------- */
function day(n,t){ return '<div class="day"><div class="dn">'+n+'</div><div class="dt">'+t+'</div></div>'; }
function planHTML(){
  const d = daysToQuiz(), st = studyStats();
  const weak = st.weak.concat(st.untested).slice(0,6);
  const weakLine = weak.length ? ' Your current problem states: <b>'+weak.join(', ')+'</b>.' : '';
  if (d === null) return '<p>Set your quiz date in the Study tab and this plan rewrites itself around the time you actually have.</p>';
  if (d < 0) return '<p>That quiz date has passed. Set a new one in the Study tab.</p>';
  if (d === 0) return day('TODAY','<b>Quiz day.</b> One full Exam sheet, cold, first thing. Drill only what it catches. Nothing new, no cramming in the last hour: you cannot add states now, you can only tire yourself out.'+weakLine);
  if (d === 1) return (
    day('TONIGHT','<b>One cold Exam sheet</b> with Instant check off. Then hit Drill these on whatever it catches and clear the Study queue once. Stop there. Sleep is doing the consolidation work, and a second hour tonight buys less than the hour of sleep it costs.'+weakLine) +
    day('MORNING','<b>One more cold Exam sheet.</b> Anything you miss twice in a row, write out by hand and place on a paper map. Then a Speed run to make recall automatic under time pressure.') +
    day('LAST HOUR','Nothing new. Skim the map once. Walk in.'));
  if (d <= 3) return (
    day('TODAY','<b>Cold Exam sheet</b>, then Region drills on every chunk showing under 90%, then clear the Study queue.'+weakLine) +
    day('TOMORROW','<b>Interleaved drill</b> plus a timed Exam sheet. Interleaving feels worse than drilling one region and retains better.') +
    day('QUIZ EVE','One cold sheet, drill the misses, stop early.'));
  return (
    day('DAY 1','<b>Cold Exam sheet.</b> You will score badly; that is the point. It tells you which states are the real problem instead of burning an hour on the ones you know. Then three Region drills.') +
    day('DAY 2','Three more chunks, then ten minutes of Study. Do not reopen yesterday\'s chunks first; let them sit.') +
    day('DAY 3','Remaining chunks, then Interleaved.') +
    day('DAY 4','Full timed Exam sheet. Feed every miss into Study. Then a Speed run.') +
    day('QUIZ EVE','One clean sheet, nothing new.'));
}

function modeBook(){
  fit(); clearNums(); resetClasses('hidenum'); setNav(null); onStateClick = n => locate(n,300);
  const bst=studyStats(), bv=verdictOf(bst);
  setMargin([['Mode','Playbook'],['Projected',`${Math.round(bst.proj)}<small> / 50</small>`],['Verdict',bv.label],['Rule','Test, do not reread']]);
  work.innerHTML = `<div class="book">
  <p class="lede">Two techniques beat every other study method in the meta-analyses, and neither one is rereading your notes. Everything below is built on those two.</p>
  <p>How this app schedules you: every answer in every mode is graded silently (exact and fast, exact, right-state-wrong-spelling, wrong) and fed to an FSRS-5 memory model, one record per state. The Study tab serves whatever is not projected to survive until your quiz date at 90% retention, and the readiness verdict combines that projection with your latest full exam sheets. Set your quiz date in the Study tab first; everything targets it.</p>

  <h2>What the evidence actually says</h2>
  <ul>
    <li><b>Practice testing wins.</b> Hattie and Donoghue's 2021 meta-analysis of 242 studies, 1,619 effects and 169,179 participants replicated Dunlosky's 2013 finding: distributed practice and practice testing are the two most effective techniques available. Not highlighting, not summarizing, not rereading.</li>
    <li><b>Retrieval beats even elaborate study.</b> Karpicke and Blunt found retrieval practice outperformed concept mapping, and it still won when the final test was building a concept map. Pulling something out of memory is the thing that strengthens it, not looking at it longer.</li>
    <li><b>This has been tested on geography specifically.</b> In two studies of schoolchildren learning geographical facts, the retrieval-practice group recalled significantly more at four days, and the benefit held at one and five weeks. Mind mapping showed no consistent effect.</li>
    <li><b>Spacing multiplies it.</b> The same total study time split across several days beats one long session. Letting a memory almost fade before you pull it back is what makes it durable.</li>
    <li><b>Vary the cue.</b> Changing how you are prompted between sessions boosts spaced retrieval further. So rotate: number to name, name to location, and blank map from scratch.</li>
    <li><b>Testing lowers exam anxiety.</b> Agarwal's classroom work found regular retrieval practice reduced test anxiety rather than adding to it. Every practice sheet you fail now is one you will not fail in the room.</li>
  </ul>

  <h2>Your plan</h2>
  ${planHTML()}

  <h3>One more thing worth doing on paper</h3>
  <p>Once a day, draw the outline of the country from memory on blank paper and fill in every state you can. Generating the map yourself, rather than filling in one that is already drawn, is a harder retrieval and it is the closest match to a version of this quiz where the outlines are unfamiliar.</p>

  <h2>The nine chunks</h2>
  <p style="color:var(--ink2)">Working memory holds a handful of items, not fifty. These groups are sized for that, and each one has a physical or verbal hook. Tap any state name on the map to zoom to it.</p>
  ${REGIONS.map(r=>`<div class="cue"><b>${r.name} <span style="font-family:var(--mono);font-weight:400;color:var(--ink3);font-size:12px">${r.states.length}</span></b><span>${r.cue}</span></div>`).join('')}

  <h3>Traps that cost people points</h3>
  <ul>
    <li><b>Vermont and New Hampshire.</b> New Hampshire touches Maine. Vermont touches New York.</li>
    <li><b>The Dakotas, the Carolinas, the Virginias.</b> North is above South in both Dakota and Carolina pairs. West Virginia is not west of Virginia in the way you would guess, it is above and to the northwest, and it is the ragged one.</li>
    <li><b>Mississippi and Alabama.</b> Going east along the Gulf: Louisiana, Mississippi, Alabama. Alphabetical order runs backwards here, which is exactly why people flip them.</li>
    <li><b>Iowa, Ohio, Idaho.</b> Three short vowel-heavy names, three different places. Iowa is above Missouri, Ohio is east of Indiana, Idaho is out west next to Oregon.</li>
    <li><b>Delaware and Maryland.</b> Delaware is the small strip on the ocean side. Maryland is the larger one wrapping the bay.</li>
    <li><b>Spelling.</b> Massachusetts, Mississippi, Connecticut, Pennsylvania, Tennessee. If the sheet says spell it, these five are where sheets get marked down. This app flags a right state with wrong spelling in amber so you can see the difference.</li>
  </ul>

  <div class="src">Sources · Hattie &amp; Donoghue, A Meta-Analysis of Ten Learning Techniques (2021), replicating Dunlosky et al. (2013) · Karpicke &amp; Blunt, Science (2011) · Retrieval Practice, with or without Mind Mapping, Boosts Fact Learning in Primary School Children, PLOS ONE · Carpenter et al., Nature Reviews Psychology (2022) · Agarwal et al. (2014) on retrieval practice and test anxiety.</div>
  </div>`;

}

    ensureFS();

    if (old){ migrateLeitner(old); saveFS(); }
  }
  apply(); modeExam();
})();

</script>
