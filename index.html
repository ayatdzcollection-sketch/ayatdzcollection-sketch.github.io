<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F1ED">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<link rel="icon" href="study/assets/icon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#F2F1ED; --sheet:#FFFFFF; --ink:#1B2327; --ink2:#4E5B61; --ink3:#87949A;
  --rule:#D2D2CB; --rule2:#E4E4DD; --accent:#6B5430; --bad:#94402E; --ok:#3C6E47;
  --mono:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --serif:Georgia,"Times New Roman",serif;
  --cond:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
}
.card{width:100%;max-width:430px}
.eyebrow{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3)}
h1{margin:4px 0 0;font-size:30px;font-weight:600;letter-spacing:-.01em}
p.lede{margin:8px 0 22px;color:var(--ink2);font-size:15.5px}
label{display:block;margin-bottom:6px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;gap:8px}
input{flex:1 1 auto;min-width:0;height:52px;font-family:var(--mono);font-size:17px;
  letter-spacing:.06em;background:var(--sheet);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:0 14px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{min-height:52px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);font-family:var(--cond);font-size:15px;font-weight:600;
  border-radius:2px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button[disabled]{opacity:.45;cursor:default}
.msg{margin:12px 0 0;font-size:14.5px;color:var(--bad);min-height:1.4em}
.links{list-style:none;margin:22px 0 0;padding:0}
.links li{border-top:1px solid var(--rule2)}
.links li:last-child{border-bottom:1px solid var(--rule2)}
.links a{display:block;min-height:62px;padding:15px 2px;text-decoration:none;color:inherit}
.links a:active{background:#EDEDE7}
.links .t{display:block;font-size:18px;font-weight:600}
.links .d{display:block;margin-top:2px;font-size:14.5px;color:var(--ink2)}
.role{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid var(--accent);
  color:var(--accent);border-radius:2px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;vertical-align:2px}
.foot{margin:22px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);line-height:1.6}
.lock{margin-top:18px}
</style>
</head>
<body>
<main class="card">

  <p class="eyebrow">Private</p>
  <h1 id="head">Enter your code</h1>
  <p class="lede" id="lede">Not indexed, not linked anywhere.</p>

  <form id="gate">
    <label for="code">Access code</label>
    <div class="row">
      <input id="code" type="password" autocomplete="current-password" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="••••••••••">
      <button type="submit" id="go">Open</button>
    </div>
    <p class="msg" id="msg"></p>
  </form>

  <div id="inside" hidden>
    <ul class="links">
      <li>
        <a href="study/">
          <span class="t">Study Hub</span>
          <span class="d">Class materials, offline-capable, synced across devices.</span>
        </a>
      </li>
    </ul>
    <p class="foot">
      Your code is checked on the server, and this browser stays signed in.
      Study materials are published encrypted; these links are a convenience, not the lock.
    </p>
    <button type="button" id="lock" class="ghost lock">Sign out of this device</button>
  </div>

</main>

<script src="study/assets/auth.js"></script>
<script>
/* The same session the hub uses. Signing in here signs you in there, and the other way
   round. What protects the materials is that they are encrypted — this page just decides
   whether to show you the door. */
(function () {
  var gate = document.getElementById('gate');
  var inside = document.getElementById('inside');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function reveal(role) {
    gate.hidden = true;
    inside.hidden = false;
    document.getElementById('head').innerHTML =
      'Contents<span class="role">' + (role === 'admin' ? 'Admin' : 'Viewer') + '</span>';
    document.getElementById('lede').textContent = 'Everything published here.';
  }

  if (StudyAuth.signedIn()) {
    reveal(StudyAuth.role());
    StudyAuth.verify().then(function (r) { if (!r) location.reload(); });
  }

  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    var code = document.getElementById('code').value;
    if (!code.trim()) { msg.textContent = 'Enter your code.'; return; }
    go.disabled = true; go.textContent = 'Checking…';
    StudyAuth.login(code).then(function (role) {
      go.disabled = false; go.textContent = 'Open';
      document.getElementById('code').value = '';
      reveal(role);
    }, function (err) {
      go.disabled = false; go.textContent = 'Open';
      msg.textContent = err.friendly || 'That code was not recognised.';
      document.getElementById('code').select();
    });
  });

  document.getElementById('lock').addEventListener('click', function () {
    StudyAuth.signOut();
    location.reload();
  });
})();
</script>
</body>
</html>
