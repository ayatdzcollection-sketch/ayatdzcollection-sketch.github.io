<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)">
<title>Not here</title>
<link rel="icon" href="/study/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/study/assets/ui.css">
</head>
<body class="ui m-hub">
<main class="screen" style="min-height:100vh;min-height:100dvh;padding-top:calc(var(--safe-top) + 72px)">
  <div class="stack-8">
    <h1 class="t-title" id="h">Nothing at this address</h1>
    <p class="t-callout c2" id="p">The page you asked for is not here.</p>
    <p class="t-foot c2" id="u"></p>
  </div>
  <a class="btn btn-primary" href="/study/" id="go" style="margin-top:auto">Go to the hub</a>
</main>
<script>
/* Materials used to live at m/<class>/<name>.html. They are now encrypted and opened
   through the viewer, so an old link or bookmark would otherwise dead-end here. Send it
   where it was trying to go instead. */
(function () {
  var path = location.pathname;
  document.getElementById('u').textContent = path;

  var m = path.match(/\/study\/m\/([^\/]+)\/([^\/]+)\.html?$/i);
  if (m) {
    var target = '/study/view.html?m=' + encodeURIComponent(m[1] + '/' + m[2]);
    document.getElementById('h').textContent = 'This one moved';
    document.getElementById('p').textContent =
      'Materials are opened through the hub now. Taking you there.';
    document.getElementById('go').href = target;
    document.getElementById('go').textContent = 'Open it';
    location.replace(target);
  }
})();
</script>
</body>
</html>
